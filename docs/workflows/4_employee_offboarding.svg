<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 840 1080" class="w-full h-auto drop-shadow-xs" xmlns="http://www.w3.org/2000/svg"><rect width="840" height="1080" fill="#ffffff"/>
            <text x="420" y="42" text-anchor="middle" font-size="20" font-weight="900" fill="#1c1917" letter-spacing="0.5" font-family="system-ui, -apple-system, sans-serif">IT SERVICE DESK (WORKFLOWS)</text>
            <line x1="260" y1="52" x2="580" y2="52" stroke="#1c1917" stroke-width="2.5" />
            <text x="50" y="95" font-size="16" font-weight="800" fill="#1c1917" font-family="system-ui, -apple-system, sans-serif">4) EMPLOYEE OFFBOARDING WORKFLOW</text>

            <line x1="420" y1="165" x2="420" y2="198" stroke="#9e988f" stroke-width="1.6" marker-end="url(#arrow)" />

            <!-- Start Pill -->
            <g class="node-card">
              <rect x="260" y="125" width="320" height="42" rx="21" fill="#f2f0ea" stroke="#d5d0c5" stroke-width="1.5" />
              <text x="420" y="151" text-anchor="middle" font-size="13.5" font-weight="600" fill="#292524" font-family="system-ui, -apple-system, sans-serif">HR / Manager initiates offboarding</text>
            </g>

            <!-- Decision: Immediate / Involuntary? -->
            <g class="node-card">
              <rect x="250" y="200" width="340" height="58" rx="8" fill="#fdf3e7" stroke="#e8d0b2" stroke-width="1.5" />
              <text x="420" y="224" text-anchor="middle" font-size="13" font-weight="700" fill="#6f4218" font-family="system-ui, -apple-system, sans-serif">Immediate / Involuntary departure?</text>
              <text x="420" y="244" text-anchor="middle" font-size="11" font-weight="500" fill="#925f34" font-family="system-ui, -apple-system, sans-serif">Assesses immediate risk &amp; data safety</text>
            </g>

            <!-- Branch: Yes -> Urgent Lockdown -->
            <path d="M 590 229 L 690 229 L 690 278" fill="none" stroke="#9e988f" stroke-width="1.6" marker-end="url(#arrow)" />
            <text x="635" y="222" font-size="12" font-weight="600" fill="#6b7280" font-family="system-ui, -apple-system, sans-serif">Yes</text>

            <g class="node-card">
              <rect x="590" y="280" width="200" height="56" rx="8" fill="#fce9e6" stroke="#f7c6bd" stroke-width="1.5" />
              <text x="690" y="303" text-anchor="middle" font-size="13" font-weight="700" fill="#991b1b" font-family="system-ui, -apple-system, sans-serif">Urgent session kill</text>
              <text x="690" y="322" text-anchor="middle" font-size="11" font-weight="600" fill="#b91c1c" font-family="system-ui, -apple-system, sans-serif">Revoke SSO, VPN &amp; MFA</text>
            </g>
            <path d="M 690 336 L 690 540 L 570 540" fill="none" stroke="#9e988f" stroke-width="1.6" />

            <!-- Branch: No -> Normal Checklist -->
            <line x1="420" y1="258" x2="420" y2="298" stroke="#9e988f" stroke-width="1.6" marker-end="url(#arrow)" />
            <text x="430" y="280" font-size="12" font-weight="600" fill="#6b7280" font-family="system-ui, -apple-system, sans-serif">No</text>

            <!-- Retrieve assets checklist -->
            <g class="node-card">
              <rect x="270" y="300" width="300" height="58" rx="8" fill="#e0f5ed" stroke="#a3e3cd" stroke-width="1.5" />
              <text x="420" y="324" text-anchor="middle" font-size="13" font-weight="700" fill="#065f46" font-family="system-ui, -apple-system, sans-serif">Review assigned company assets</text>
              <text x="420" y="344" text-anchor="middle" font-size="11" font-weight="500" fill="#047857" font-family="system-ui, -apple-system, sans-serif">Cross-reference CMDB &amp; badge access</text>
            </g>

            <line x1="420" y1="358" x2="420" y2="398" stroke="#9e988f" stroke-width="1.6" marker-end="url(#arrow)" />

            <!-- Decision: Assets returned? -->
            <g class="node-card">
              <rect x="270" y="400" width="300" height="58" rx="8" fill="#fdf3e7" stroke="#e8d0b2" stroke-width="1.5" />
              <text x="420" y="424" text-anchor="middle" font-size="13" font-weight="700" fill="#6f4218" font-family="system-ui, -apple-system, sans-serif">All hardware assets returned?</text>
              <text x="420" y="444" text-anchor="middle" font-size="11" font-weight="500" fill="#925f34" font-family="system-ui, -apple-system, sans-serif">Laptops, monitors, security tokens</text>
            </g>

            <!-- Branch: No -> Escrow hold -->
            <path d="M 270 429 L 160 429 L 160 478" fill="none" stroke="#9e988f" stroke-width="1.6" marker-end="url(#arrow)" />
            <text x="210" y="422" font-size="12" font-weight="600" fill="#6b7280" font-family="system-ui, -apple-system, sans-serif">No</text>

            <g class="node-card">
              <rect x="70" y="480" width="180" height="56" rx="8" fill="#fdf3e7" stroke="#e8d0b2" stroke-width="1.5" />
              <text x="160" y="503" text-anchor="middle" font-size="13" font-weight="700" fill="#6f4218" font-family="system-ui, -apple-system, sans-serif">Send return notice</text>
              <text x="160" y="522" text-anchor="middle" font-size="11" font-weight="500" fill="#925f34" font-family="system-ui, -apple-system, sans-serif">Escrow clearance hold</text>
            </g>
            <path d="M 160 536 L 160 620 L 270 620" fill="none" stroke="#9e988f" stroke-width="1.6" />

            <!-- Branch: Yes -> Revoke accounts -->
            <line x1="420" y1="458" x2="420" y2="508" stroke="#9e988f" stroke-width="1.6" marker-end="url(#arrow)" />
            <text x="430" y="480" font-size="12" font-weight="600" fill="#6b7280" font-family="system-ui, -apple-system, sans-serif">Yes</text>

            <!-- Revoke all permissions -->
            <g class="node-card">
              <rect x="270" y="510" width="300" height="58" rx="8" fill="#e0f5ed" stroke="#a3e3cd" stroke-width="1.5" />
              <text x="420" y="534" text-anchor="middle" font-size="13" font-weight="700" fill="#065f46" font-family="system-ui, -apple-system, sans-serif">Revoke all cloud &amp; SaaS permissions</text>
              <text x="420" y="554" text-anchor="middle" font-size="11" font-weight="500" fill="#047857" font-family="system-ui, -apple-system, sans-serif">Google, Slack, GitHub, AWS, Jira</text>
            </g>

            <line x1="420" y1="568" x2="420" y2="608" stroke="#9e988f" stroke-width="1.6" marker-end="url(#arrow)" />

            <!-- Archive mailbox & transfer data -->
            <g class="node-card">
              <rect x="270" y="610" width="300" height="58" rx="8" fill="#e0f5ed" stroke="#a3e3cd" stroke-width="1.5" />
              <text x="420" y="634" text-anchor="middle" font-size="13" font-weight="700" fill="#065f46" font-family="system-ui, -apple-system, sans-serif">Archive mailbox &amp; delegate files</text>
              <text x="420" y="654" text-anchor="middle" font-size="11" font-weight="500" fill="#047857" font-family="system-ui, -apple-system, sans-serif">Transfer Google Drive/OneDrive to manager</text>
            </g>

            <line x1="420" y1="668" x2="420" y2="708" stroke="#9e988f" stroke-width="1.6" marker-end="url(#arrow)" />

            <!-- Deactivate Account -->
            <g class="node-card">
              <rect x="270" y="710" width="300" height="56" rx="8" fill="#fce9e6" stroke="#f7c6bd" stroke-width="1.5" />
              <text x="420" y="733" text-anchor="middle" font-size="13" font-weight="700" fill="#991b1b" font-family="system-ui, -apple-system, sans-serif">Deactivate user account</text>
              <text x="420" y="752" text-anchor="middle" font-size="11" font-weight="600" fill="#b91c1c" font-family="system-ui, -apple-system, sans-serif">Status: Inactive &amp; Archived</text>
            </g>

            <line x1="420" y1="766" x2="420" y2="806" stroke="#9e988f" stroke-width="1.6" marker-end="url(#arrow)" />

            <!-- Send Completion Report -->
            <g class="node-card">
              <rect x="270" y="808" width="300" height="46" rx="8" fill="#f2f0ea" stroke="#d5d0c5" stroke-width="1.5" />
              <text x="420" y="836" text-anchor="middle" font-size="13" font-weight="600" fill="#292524" font-family="system-ui, -apple-system, sans-serif">Send final offboarding audit to HR</text>
            </g>

            <line x1="420" y1="854" x2="420" y2="894" stroke="#9e988f" stroke-width="1.6" marker-end="url(#arrow)" />

            <!-- End Pill -->
            <g class="node-card">
              <rect x="355" y="896" width="130" height="40" rx="20" fill="#f2f0ea" stroke="#d5d0c5" stroke-width="1.5" />
              <text x="420" y="921" text-anchor="middle" font-size="13" font-weight="600" fill="#292524" font-family="system-ui, -apple-system, sans-serif">End</text>
            </g>
          </svg>