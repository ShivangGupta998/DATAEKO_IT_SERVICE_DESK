<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 840 1140" class="w-full h-auto drop-shadow-xs" xmlns="http://www.w3.org/2000/svg">
  <rect width="840" height="1140" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#8c857b" />
    </marker>
  </defs>

  <!-- Title & Underline -->
  <text x="420" y="42" text-anchor="middle" font-size="20" font-weight="900" fill="#1c1917" letter-spacing="0.5" font-family="system-ui, -apple-system, sans-serif">IT SERVICE DESK (WORKFLOWS)</text>
  <line x1="260" y1="52" x2="580" y2="52" stroke="#1c1917" stroke-width="2.5" />

  <!-- Subheading -->
  <text x="50" y="95" font-size="16" font-weight="800" fill="#1c1917" font-family="system-ui, -apple-system, sans-serif">6) USER PROFILE &amp; PREFERENCES MANAGEMENT WORKFLOW</text>

  <!-- Start Pill -->
  <line x1="420" y1="165" x2="420" y2="198" stroke="#9e988f" stroke-width="1.6" marker-end="url(#arrow)" />
  <g class="node-card">
    <rect x="270" y="125" width="300" height="42" rx="21" fill="#f2f0ea" stroke="#d5d0c5" stroke-width="1.5" />
    <text x="420" y="151" text-anchor="middle" font-size="13.5" font-weight="600" fill="#292524" font-family="system-ui, -apple-system, sans-serif">User opens Profile &amp; Settings (/profile)</text>
  </g>

  <!-- Decision: Auth Check -->
  <g class="node-card">
    <rect x="250" y="200" width="340" height="58" rx="8" fill="#fdf3e7" stroke="#e8d0b2" stroke-width="1.5" />
    <text x="420" y="224" text-anchor="middle" font-size="13" font-weight="700" fill="#6f4218" font-family="system-ui, -apple-system, sans-serif">Authenticated session active?</text>
    <text x="420" y="244" text-anchor="middle" font-size="11" font-weight="500" fill="#925f34" font-family="system-ui, -apple-system, sans-serif">Checks JWT Bearer token validity</text>
  </g>

  <!-- Branch No -> Unauthorized / Login -->
  <path d="M 250 229 L 140 229 L 140 288" fill="none" stroke="#9e988f" stroke-width="1.6" marker-end="url(#arrow)" />
  <text x="190" y="222" font-size="11.5" font-weight="600" fill="#6b7280" font-family="system-ui, -apple-system, sans-serif">No / Expired</text>

  <g class="node-card">
    <rect x="40" y="290" width="200" height="56" rx="8" fill="#fce9e6" stroke="#f7c6bd" stroke-width="1.5" />
    <text x="140" y="313" text-anchor="middle" font-size="12.5" font-weight="700" fill="#991b1b" font-family="system-ui, -apple-system, sans-serif">Redirect to /login</text>
    <text x="140" y="332" text-anchor="middle" font-size="10.5" font-weight="500" fill="#b91c1c" font-family="system-ui, -apple-system, sans-serif">Prompt credentials re-entry</text>
  </g>

  <!-- Branch Yes -> Load Profile -->
  <line x1="420" y1="258" x2="420" y2="288" stroke="#9e988f" stroke-width="1.6" marker-end="url(#arrow)" />
  <text x="428" y="276" font-size="11.5" font-weight="600" fill="#6b7280" font-family="system-ui, -apple-system, sans-serif">Yes</text>

  <g class="node-card">
    <rect x="260" y="290" width="320" height="58" rx="8" fill="#e0f5ed" stroke="#a3e3cd" stroke-width="1.5" />
    <text x="420" y="314" text-anchor="middle" font-size="13" font-weight="700" fill="#065f46" font-family="system-ui, -apple-system, sans-serif">Load user identity &amp; preferences</text>
    <text x="420" y="334" text-anchor="middle" font-size="11" font-weight="500" fill="#047857" font-family="system-ui, -apple-system, sans-serif">Avatar, Name, Role, Dept &amp; OOO status</text>
  </g>

  <!-- Connector to Tab Selection -->
  <line x1="420" y1="348" x2="420" y2="378" stroke="#9e988f" stroke-width="1.6" marker-end="url(#arrow)" />

  <!-- Decision: Select Tab -->
  <g class="node-card">
    <rect x="250" y="380" width="340" height="58" rx="8" fill="#fdf3e7" stroke="#e8d0b2" stroke-width="1.5" />
    <text x="420" y="404" text-anchor="middle" font-size="13" font-weight="700" fill="#6f4218" font-family="system-ui, -apple-system, sans-serif">Select Management Tab</text>
    <text x="420" y="424" text-anchor="middle" font-size="11" font-weight="500" fill="#925f34" font-family="system-ui, -apple-system, sans-serif">Personal Info / Security / Preferences</text>
  </g>

  <!-- 3 Branches from Tab Selection -->
  <!-- Branch 1: Left (Personal Info) -->
  <path d="M 250 409 L 140 409 L 140 468" fill="none" stroke="#9e988f" stroke-width="1.6" marker-end="url(#arrow)" />
  <text x="155" y="401" font-size="11" font-weight="600" fill="#6b7280" font-family="system-ui, -apple-system, sans-serif">Personal Info</text>

  <!-- Branch 2: Center (Security & Password) -->
  <line x1="420" y1="438" x2="420" y2="468" stroke="#9e988f" stroke-width="1.6" marker-end="url(#arrow)" />
  <text x="428" y="456" font-size="11" font-weight="600" fill="#6b7280" font-family="system-ui, -apple-system, sans-serif">Security</text>

  <!-- Branch 3: Right (Preferences & OOO) -->
  <path d="M 590 409 L 700 409 L 700 468" fill="none" stroke="#9e988f" stroke-width="1.6" marker-end="url(#arrow)" />
  <text x="605" y="401" font-size="11" font-weight="600" fill="#6b7280" font-family="system-ui, -apple-system, sans-serif">Preferences &amp; OOO</text>

  <!-- COLUMN 1: Personal Info -->
  <g class="node-card">
    <rect x="35" y="470" width="210" height="56" rx="8" fill="#e0f5ed" stroke="#a3e3cd" stroke-width="1.5" />
    <text x="140" y="493" text-anchor="middle" font-size="12" font-weight="700" fill="#065f46" font-family="system-ui, -apple-system, sans-serif">Edit personal details</text>
    <text x="140" y="512" text-anchor="middle" font-size="10.5" font-weight="500" fill="#047857" font-family="system-ui, -apple-system, sans-serif">Name, phone, title &amp; timezone</text>
  </g>
  <line x1="140" y1="526" x2="140" y2="558" stroke="#9e988f" stroke-width="1.6" marker-end="url(#arrow)" />
  <g class="node-card">
    <rect x="35" y="560" width="210" height="56" rx="8" fill="#e0f5ed" stroke="#a3e3cd" stroke-width="1.5" />
    <text x="140" y="583" text-anchor="middle" font-size="12" font-weight="700" fill="#065f46" font-family="system-ui, -apple-system, sans-serif">Upload or remove avatar</text>
    <text x="140" y="602" text-anchor="middle" font-size="10.5" font-weight="500" fill="#047857" font-family="system-ui, -apple-system, sans-serif">Image crop &amp; base64/URL sync</text>
  </g>
  <line x1="140" y1="616" x2="140" y2="648" stroke="#9e988f" stroke-width="1.6" marker-end="url(#arrow)" />
  <g class="node-card">
    <rect x="35" y="650" width="210" height="56" rx="8" fill="#e0f5ed" stroke="#a3e3cd" stroke-width="1.5" />
    <text x="140" y="673" text-anchor="middle" font-size="12" font-weight="700" fill="#065f46" font-family="system-ui, -apple-system, sans-serif">Save profile details</text>
    <text x="140" y="692" text-anchor="middle" font-size="10.5" font-weight="500" fill="#047857" font-family="system-ui, -apple-system, sans-serif">Instant navbar &amp; audit refresh</text>
  </g>

  <!-- COLUMN 2: Account Security & Password -->
  <g class="node-card">
    <rect x="315" y="470" width="210" height="56" rx="8" fill="#f2f0ea" stroke="#d5d0c5" stroke-width="1.5" />
    <text x="420" y="493" text-anchor="middle" font-size="12" font-weight="700" fill="#292524" font-family="system-ui, -apple-system, sans-serif">Enter current &amp; new password</text>
    <text x="420" y="512" text-anchor="middle" font-size="10.5" font-weight="500" fill="#6b7280" font-family="system-ui, -apple-system, sans-serif">Min 6 chars &amp; confirmation match</text>
  </g>
  <line x1="420" y1="526" x2="420" y2="558" stroke="#9e988f" stroke-width="1.6" marker-end="url(#arrow)" />
  <g class="node-card">
    <rect x="315" y="560" width="210" height="58" rx="8" fill="#fdf3e7" stroke="#e8d0b2" stroke-width="1.5" />
    <text x="420" y="584" text-anchor="middle" font-size="12" font-weight="700" fill="#6f4218" font-family="system-ui, -apple-system, sans-serif">Current password correct?</text>
    <text x="420" y="603" text-anchor="middle" font-size="10.5" font-weight="500" fill="#925f34" font-family="system-ui, -apple-system, sans-serif">Bcrypt server-side check</text>
  </g>
  <line x1="420" y1="618" x2="420" y2="648" stroke="#9e988f" stroke-width="1.6" marker-end="url(#arrow)" />
  <text x="428" y="636" font-size="11" font-weight="600" fill="#6b7280" font-family="system-ui, -apple-system, sans-serif">Yes</text>
  <g class="node-card">
    <rect x="315" y="650" width="210" height="56" rx="8" fill="#e0f5ed" stroke="#a3e3cd" stroke-width="1.5" />
    <text x="420" y="673" text-anchor="middle" font-size="12" font-weight="700" fill="#065f46" font-family="system-ui, -apple-system, sans-serif">Hash with bcrypt &amp; update</text>
    <text x="420" y="692" text-anchor="middle" font-size="10.5" font-weight="500" fill="#047857" font-family="system-ui, -apple-system, sans-serif">Invalidate old sessions &amp; log audit</text>
  </g>

  <!-- COLUMN 3: Preferences & Out-of-Office -->
  <g class="node-card">
    <rect x="595" y="470" width="210" height="56" rx="8" fill="#e0f5ed" stroke="#a3e3cd" stroke-width="1.5" />
    <text x="700" y="493" text-anchor="middle" font-size="12" font-weight="700" fill="#065f46" font-family="system-ui, -apple-system, sans-serif">Set notification preferences</text>
    <text x="700" y="512" text-anchor="middle" font-size="10.5" font-weight="500" fill="#047857" font-family="system-ui, -apple-system, sans-serif">Ticket updates &amp; SLA breaches</text>
  </g>
  <line x1="700" y1="526" x2="700" y2="558" stroke="#9e988f" stroke-width="1.6" marker-end="url(#arrow)" />
  <g class="node-card">
    <rect x="595" y="560" width="210" height="58" rx="8" fill="#fdf3e7" stroke="#e8d0b2" stroke-width="1.5" />
    <text x="700" y="584" text-anchor="middle" font-size="12" font-weight="700" fill="#6f4218" font-family="system-ui, -apple-system, sans-serif">Enable Out-of-Office (OOO)?</text>
    <text x="700" y="603" text-anchor="middle" font-size="10.5" font-weight="500" fill="#925f34" font-family="system-ui, -apple-system, sans-serif">Availability for triage pool</text>
  </g>
  <line x1="700" y1="618" x2="700" y2="648" stroke="#9e988f" stroke-width="1.6" marker-end="url(#arrow)" />
  <text x="708" y="636" font-size="11" font-weight="600" fill="#6b7280" font-family="system-ui, -apple-system, sans-serif">Yes</text>
  <g class="node-card">
    <rect x="595" y="650" width="210" height="56" rx="8" fill="#fdf3e7" stroke="#e8d0b2" stroke-width="1.5" />
    <text x="700" y="673" text-anchor="middle" font-size="12" font-weight="700" fill="#6f4218" font-family="system-ui, -apple-system, sans-serif">Set return date &amp; exclude</text>
    <text x="700" y="692" text-anchor="middle" font-size="10.5" font-weight="500" fill="#925f34" font-family="system-ui, -apple-system, sans-serif">Excludes technician from auto-assign</text>
  </g>

  <!-- Convergence to Save & Confirmation -->
  <path d="M 140 706 L 140 760 L 320 760" fill="none" stroke="#9e988f" stroke-width="1.6" />
  <line x1="420" y1="706" x2="420" y2="778" stroke="#9e988f" stroke-width="1.6" marker-end="url(#arrow)" />
  <path d="M 700 706 L 700 760 L 520 760" fill="none" stroke="#9e988f" stroke-width="1.6" />

  <!-- Node: Save Confirmation Toast -->
  <g class="node-card">
    <rect x="260" y="780" width="320" height="58" rx="8" fill="#e0f5ed" stroke="#a3e3cd" stroke-width="1.5" />
    <text x="420" y="804" text-anchor="middle" font-size="13" font-weight="700" fill="#065f46" font-family="system-ui, -apple-system, sans-serif">Apply settings &amp; show toast</text>
    <text x="420" y="824" text-anchor="middle" font-size="11" font-weight="500" fill="#047857" font-family="system-ui, -apple-system, sans-serif">Profile, Theme &amp; Availability synchronized</text>
  </g>

  <!-- Connector to End -->
  <line x1="420" y1="838" x2="420" y2="888" stroke="#9e988f" stroke-width="1.6" marker-end="url(#arrow)" />

  <!-- End Pill -->
  <g class="node-card">
    <rect x="310" y="890" width="220" height="42" rx="21" fill="#f2f0ea" stroke="#d5d0c5" stroke-width="1.5" />
    <text x="420" y="916" text-anchor="middle" font-size="13" font-weight="600" fill="#292524" font-family="system-ui, -apple-system, sans-serif">End (Profile Configured)</text>
  </g>
</svg>