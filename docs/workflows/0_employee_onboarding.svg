<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 840 1250" class="w-full h-auto drop-shadow-xs" xmlns="http://www.w3.org/2000/svg"><rect width="840" height="1250" fill="#ffffff"/>
            <defs>
              <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#8c857b" />
              </marker>
            </defs>

            <!-- Title & Underline -->
            <text x="420" y="42" text-anchor="middle" font-size="20" font-weight="900" fill="#1c1917" letter-spacing="0.5" font-family="system-ui, -apple-system, sans-serif">IT SERVICE DESK (WORKFLOWS)</text>
            <line x1="260" y1="52" x2="580" y2="52" stroke="#1c1917" stroke-width="2.5" />

            <!-- Subheading -->
            <text x="50" y="95" font-size="16" font-weight="800" fill="#1c1917" font-family="system-ui, -apple-system, sans-serif">0) EMPLOYEE ONBOARDING WORKFLOW</text>

            <!-- Connector: Start to Decision 1 -->
            <line x1="420" y1="165" x2="420" y2="198" stroke="#9e988f" stroke-width="1.6" marker-end="url(#arrow)" />

            <!-- Node 1: HR / Manager submits new hire details -->
            <g class="node-card">
              <rect x="260" y="125" width="320" height="42" rx="21" fill="#f2f0ea" stroke="#d5d0c5" stroke-width="1.5" />
              <text x="420" y="151" text-anchor="middle" font-size="13.5" font-weight="600" fill="#292524" font-family="system-ui, -apple-system, sans-serif">HR / Manager submits new hire details</text>
            </g>

            <!-- Node 2: Is requestor Admin or Manager? (Decision 1) -->
            <g class="node-card">
              <rect x="250" y="200" width="340" height="58" rx="8" fill="#fdf3e7" stroke="#e8d0b2" stroke-width="1.5" />
              <text x="420" y="224" text-anchor="middle" font-size="13" font-weight="700" fill="#6f4218" font-family="system-ui, -apple-system, sans-serif">Is requestor Admin or Manager?</text>
              <text x="420" y="244" text-anchor="middle" font-size="11" font-weight="500" fill="#925f34" font-family="system-ui, -apple-system, sans-serif">Checks authorization &amp; RBAC permissions</text>
            </g>

            <!-- Branch: No (Right) -> 403 Forbidden -->
            <path d="M 590 229 L 690 229 L 690 268" fill="none" stroke="#9e988f" stroke-width="1.6" marker-end="url(#arrow)" />
            <text x="635" y="222" font-size="12" font-weight="600" fill="#6b7280" font-family="system-ui, -apple-system, sans-serif">No</text>

            <g class="node-card">
              <rect x="590" y="270" width="200" height="56" rx="8" fill="#fce9e6" stroke="#f7c6bd" stroke-width="1.5" />
              <text x="690" y="293" text-anchor="middle" font-size="13" font-weight="700" fill="#991b1b" font-family="system-ui, -apple-system, sans-serif">Reject request</text>
              <text x="690" y="312" text-anchor="middle" font-size="11" font-weight="600" fill="#b91c1c" font-family="system-ui, -apple-system, sans-serif">403 Forbidden: Unauthorized</text>
            </g>

            <line x1="690" y1="326" x2="690" y2="355" stroke="#9e988f" stroke-width="1.6" marker-end="url(#arrow)" />

            <g class="node-card">
              <rect x="590" y="357" width="200" height="54" rx="8" fill="#f2f0ea" stroke="#d5d0c5" stroke-width="1.5" />
              <text x="690" y="380" text-anchor="middle" font-size="13" font-weight="700" fill="#292524" font-family="system-ui, -apple-system, sans-serif">Notify requestor</text>
              <text x="690" y="399" text-anchor="middle" font-size="11" font-weight="500" fill="#6b7280" font-family="system-ui, -apple-system, sans-serif">Security event logged</text>
            </g>
            <path d="M 690 411 L 690 1150 L 420 1150" fill="none" stroke="#9e988f" stroke-width="1.6" />

            <!-- Branch: Yes (Center Down) -->
            <line x1="420" y1="258" x2="420" y2="295" stroke="#9e988f" stroke-width="1.6" marker-end="url(#arrow)" />
            <text x="430" y="278" font-size="12" font-weight="600" fill="#6b7280" font-family="system-ui, -apple-system, sans-serif">Yes</text>

            <!-- Node 3: Create User Account -->
            <g class="node-card">
              <rect x="250" y="298" width="340" height="58" rx="8" fill="#e0f5ed" stroke="#a3e3cd" stroke-width="1.5" />
              <text x="420" y="322" text-anchor="middle" font-size="13" font-weight="700" fill="#065f46" font-family="system-ui, -apple-system, sans-serif">Create user account &amp; credentials</text>
              <text x="420" y="342" text-anchor="middle" font-size="11" font-weight="500" fill="#047857" font-family="system-ui, -apple-system, sans-serif">Generates secure initial password &amp; profile</text>
            </g>

            <line x1="420" y1="356" x2="420" y2="388" stroke="#9e988f" stroke-width="1.6" marker-end="url(#arrow)" />

            <!-- Node 4: Assign Role & Department -->
            <g class="node-card">
              <rect x="250" y="390" width="340" height="58" rx="8" fill="#e0f5ed" stroke="#a3e3cd" stroke-width="1.5" />
              <text x="420" y="414" text-anchor="middle" font-size="13" font-weight="700" fill="#065f46" font-family="system-ui, -apple-system, sans-serif">Assign role &amp; department</text>
              <text x="420" y="434" text-anchor="middle" font-size="11" font-weight="500" fill="#047857" font-family="system-ui, -apple-system, sans-serif">Provisions default email, Slack &amp; portal access</text>
            </g>

            <line x1="420" y1="448" x2="420" y2="480" stroke="#9e988f" stroke-width="1.6" marker-end="url(#arrow)" />

            <!-- Node 5: Physical Hardware required? (Decision 2) -->
            <g class="node-card">
              <rect x="250" y="482" width="340" height="58" rx="8" fill="#fdf3e7" stroke="#e8d0b2" stroke-width="1.5" />
              <text x="420" y="506" text-anchor="middle" font-size="13" font-weight="700" fill="#6f4218" font-family="system-ui, -apple-system, sans-serif">Physical hardware required?</text>
              <text x="420" y="526" text-anchor="middle" font-size="11" font-weight="500" fill="#925f34" font-family="system-ui, -apple-system, sans-serif">Checks department equipment policy</text>
            </g>

            <!-- Branch: No (Left - BYOD / Remote Contractor) -->
            <path d="M 250 511 L 130 511 L 130 815 L 250 815" fill="none" stroke="#9e988f" stroke-width="1.6" />
            <text x="145" y="502" font-size="11" font-weight="600" fill="#6b7280" font-family="system-ui, -apple-system, sans-serif">No (BYOD / Cloud)</text>

            <!-- Branch: Yes (Down) -->
            <line x1="420" y1="540" x2="420" y2="570" stroke="#9e988f" stroke-width="1.6" marker-end="url(#arrow)" />
            <text x="430" y="558" font-size="12" font-weight="600" fill="#6b7280" font-family="system-ui, -apple-system, sans-serif">Yes</text>

            <!-- Node 6: Hardware in stock? (Decision 3) -->
            <g class="node-card">
              <rect x="250" y="572" width="340" height="58" rx="8" fill="#fdf3e7" stroke="#e8d0b2" stroke-width="1.5" />
              <text x="420" y="596" text-anchor="middle" font-size="13" font-weight="700" fill="#6f4218" font-family="system-ui, -apple-system, sans-serif">Hardware in stock?</text>
              <text x="420" y="616" text-anchor="middle" font-size="11" font-weight="500" fill="#925f34" font-family="system-ui, -apple-system, sans-serif">Checks CMDB device inventory</text>
            </g>

            <!-- Branch: No (Procurement needed) -->
            <path d="M 590 601 L 690 601 L 690 638" fill="none" stroke="#9e988f" stroke-width="1.6" marker-end="url(#arrow)" />
            <text x="635" y="594" font-size="12" font-weight="600" fill="#6b7280" font-family="system-ui, -apple-system, sans-serif">No</text>

            <g class="node-card">
              <rect x="590" y="640" width="200" height="54" rx="8" fill="#fdf3e7" stroke="#e8d0b2" stroke-width="1.5" />
              <text x="690" y="663" text-anchor="middle" font-size="13" font-weight="700" fill="#6f4218" font-family="system-ui, -apple-system, sans-serif">Order equipment</text>
              <text x="690" y="682" text-anchor="middle" font-size="11" font-weight="500" fill="#925f34" font-family="system-ui, -apple-system, sans-serif">Procurement dispatch</text>
            </g>
            <path d="M 690 694 L 690 735 L 590 735" fill="none" stroke="#9e988f" stroke-width="1.6" />

            <!-- Branch: Yes (In stock) -->
            <line x1="420" y1="630" x2="420" y2="660" stroke="#9e988f" stroke-width="1.6" marker-end="url(#arrow)" />
            <text x="430" y="648" font-size="12" font-weight="600" fill="#6b7280" font-family="system-ui, -apple-system, sans-serif">Yes</text>

            <!-- Node 7: Image & Configure Device -->
            <g class="node-card">
              <rect x="250" y="662" width="340" height="58" rx="8" fill="#e0f5ed" stroke="#a3e3cd" stroke-width="1.5" />
              <text x="420" y="686" text-anchor="middle" font-size="13" font-weight="700" fill="#065f46" font-family="system-ui, -apple-system, sans-serif">Image &amp; configure device</text>
              <text x="420" y="706" text-anchor="middle" font-size="11" font-weight="500" fill="#047857" font-family="system-ui, -apple-system, sans-serif">Install OS, disk encryption, VPN &amp; MDM agent</text>
            </g>

            <line x1="420" y1="720" x2="420" y2="750" stroke="#9e988f" stroke-width="1.6" marker-end="url(#arrow)" />

            <!-- Node 8: Assign Asset to new employee -->
            <g class="node-card">
              <rect x="250" y="752" width="340" height="58" rx="8" fill="#e0f5ed" stroke="#a3e3cd" stroke-width="1.5" />
              <text x="420" y="776" text-anchor="middle" font-size="13" font-weight="700" fill="#065f46" font-family="system-ui, -apple-system, sans-serif">Assign asset to new employee</text>
              <text x="420" y="796" text-anchor="middle" font-size="11" font-weight="500" fill="#047857" font-family="system-ui, -apple-system, sans-serif">Record serial number &amp; equipment handover</text>
            </g>

            <line x1="420" y1="810" x2="420" y2="840" stroke="#9e988f" stroke-width="1.6" marker-end="url(#arrow)" />

            <!-- Node 9: Dispatch welcome email & credentials -->
            <g class="node-card">
              <rect x="250" y="842" width="340" height="58" rx="8" fill="#e0f5ed" stroke="#a3e3cd" stroke-width="1.5" />
              <text x="420" y="866" text-anchor="middle" font-size="13" font-weight="700" fill="#065f46" font-family="system-ui, -apple-system, sans-serif">Dispatch welcome email &amp; credentials</text>
              <text x="420" y="886" text-anchor="middle" font-size="11" font-weight="500" fill="#047857" font-family="system-ui, -apple-system, sans-serif">Login portal link &amp; temporary password</text>
            </g>

            <!-- Side notification to HR & Manager -->
            <path d="M 250 871 L 130 871 L 130 910" fill="none" stroke="#9e988f" stroke-width="1.6" marker-end="url(#arrow)" />
            <g class="node-card">
              <rect x="50" y="912" width="160" height="44" rx="8" fill="#f2f0ea" stroke="#d5d0c5" stroke-width="1.5" />
              <text x="130" y="939" text-anchor="middle" font-size="12" font-weight="600" fill="#292524" font-family="system-ui, -apple-system, sans-serif">Notify HR &amp; Manager</text>
            </g>

            <line x1="420" y1="900" x2="420" y2="932" stroke="#9e988f" stroke-width="1.6" marker-end="url(#arrow)" />

            <!-- Node 10: First login & password reset? (Decision 4) -->
            <g class="node-card">
              <rect x="250" y="934" width="340" height="58" rx="8" fill="#fdf3e7" stroke="#e8d0b2" stroke-width="1.5" />
              <text x="420" y="958" text-anchor="middle" font-size="13" font-weight="700" fill="#6f4218" font-family="system-ui, -apple-system, sans-serif">First login &amp; password reset?</text>
              <text x="420" y="978" text-anchor="middle" font-size="11" font-weight="500" fill="#925f34" font-family="system-ui, -apple-system, sans-serif">Monitors initial 24h user activation</text>
            </g>

            <!-- Branch: No (> 24h) -->
            <path d="M 590 963 L 690 963 L 690 998" fill="none" stroke="#9e988f" stroke-width="1.6" marker-end="url(#arrow)" />
            <text x="630" y="955" font-size="11" font-weight="600" fill="#6b7280" font-family="system-ui, -apple-system, sans-serif">No (&gt; 24h)</text>

            <g class="node-card">
              <rect x="590" y="1000" width="200" height="52" rx="8" fill="#f2f0ea" stroke="#d5d0c5" stroke-width="1.5" />
              <text x="690" y="1022" text-anchor="middle" font-size="13" font-weight="700" fill="#292524" font-family="system-ui, -apple-system, sans-serif">Send reminder notice</text>
              <text x="690" y="1041" text-anchor="middle" font-size="11" font-weight="500" fill="#6b7280" font-family="system-ui, -apple-system, sans-serif">Alerts hiring manager</text>
            </g>

            <!-- Branch: Yes -->
            <line x1="420" y1="992" x2="420" y2="1024" stroke="#9e988f" stroke-width="1.6" marker-end="url(#arrow)" />
            <text x="430" y="1010" font-size="12" font-weight="600" fill="#6b7280" font-family="system-ui, -apple-system, sans-serif">Yes</text>

            <!-- Node 11: Enforce MFA & complete IT orientation -->
            <g class="node-card">
              <rect x="250" y="1026" width="340" height="58" rx="8" fill="#e0f5ed" stroke="#a3e3cd" stroke-width="1.5" />
              <text x="420" y="1050" text-anchor="middle" font-size="13" font-weight="700" fill="#065f46" font-family="system-ui, -apple-system, sans-serif">Enforce MFA &amp; complete IT orientation</text>
              <text x="420" y="1070" text-anchor="middle" font-size="11" font-weight="500" fill="#047857" font-family="system-ui, -apple-system, sans-serif">Authenticator enrollment &amp; Knowledge Base guides</text>
            </g>

            <line x1="420" y1="1084" x2="420" y2="1165" stroke="#9e988f" stroke-width="1.6" marker-end="url(#arrow)" />

            <!-- Node 12: End Pill -->
            <g class="node-card">
              <rect x="290" y="1168" width="260" height="42" rx="21" fill="#f2f0ea" stroke="#d5d0c5" stroke-width="1.5" />
              <text x="420" y="1194" text-anchor="middle" font-size="13.5" font-weight="600" fill="#292524" font-family="system-ui, -apple-system, sans-serif">End (Onboarding Completed)</text>
            </g>
          </svg>