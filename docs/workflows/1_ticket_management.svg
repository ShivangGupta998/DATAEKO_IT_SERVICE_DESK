<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 840 1140" class="w-full h-auto drop-shadow-xs" xmlns="http://www.w3.org/2000/svg"><rect width="840" height="1140" fill="#ffffff"/>
            <defs>
              <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#8c857b" />
              </marker>
            </defs>

            <!-- Title & Underline -->
            <text x="420" y="42" text-anchor="middle" font-size="20" font-weight="900" fill="#1c1917" letter-spacing="0.5" font-family="system-ui, -apple-system, sans-serif">IT SERVICE DESK (WORKFLOWS)</text>
            <line x1="260" y1="52" x2="580" y2="52" stroke="#1c1917" stroke-width="2.5" />

            <!-- Subheading -->
            <text x="50" y="95" font-size="16" font-weight="800" fill="#1c1917" font-family="system-ui, -apple-system, sans-serif">1) TICKET MANAGEMENT</text>

            <!-- Connector: Start to Decision 1 -->
            <line x1="420" y1="165" x2="420" y2="198" stroke="#9e988f" stroke-width="1.6" marker-end="url(#arrow)" />

            <!-- Node 1: Employee creates ticket (Top Pill) -->
            <g class="node-card">
              <rect x="290" y="125" width="260" height="42" rx="21" fill="#f2f0ea" stroke="#d5d0c5" stroke-width="1.5" />
              <text x="420" y="151" text-anchor="middle" font-size="13.5" font-weight="600" fill="#292524" font-family="system-ui, -apple-system, sans-serif">Employee creates ticket</text>
            </g>

            <!-- Node 2: Both admin & manager on leave? (Decision 1) -->
            <g class="node-card">
              <rect x="250" y="200" width="340" height="58" rx="8" fill="#fdf3e7" stroke="#e8d0b2" stroke-width="1.5" />
              <text x="420" y="224" text-anchor="middle" font-size="13" font-weight="700" fill="#6f4218" font-family="system-ui, -apple-system, sans-serif">Both admin &amp; manager on leave?</text>
              <text x="420" y="244" text-anchor="middle" font-size="11" font-weight="500" fill="#925f34" font-family="system-ui, -apple-system, sans-serif">Checks availability</text>
            </g>

            <!-- Branch: Yes (Left from Decision 1) -->
            <path d="M 330 258 L 330 282 L 210 282 L 210 308" fill="none" stroke="#9e988f" stroke-width="1.6" marker-end="url(#arrow)" />
            <text x="312" y="274" font-size="12" font-weight="600" fill="#6b7280" font-family="system-ui, -apple-system, sans-serif">Yes</text>

            <!-- Branch: No (Right from Decision 1) -->
            <path d="M 510 258 L 510 282 L 610 282 L 610 308" fill="none" stroke="#9e988f" stroke-width="1.6" marker-end="url(#arrow)" />
            <text x="525" y="274" font-size="12" font-weight="600" fill="#6b7280" font-family="system-ui, -apple-system, sans-serif">No</text>

            <!-- Node 3: Wait in queue -->
            <g class="node-card">
              <rect x="95" y="310" width="230" height="48" rx="8" fill="#f2f0ea" stroke="#d5d0c5" stroke-width="1.5" />
              <text x="210" y="339" text-anchor="middle" font-size="13" font-weight="600" fill="#292524" font-family="system-ui, -apple-system, sans-serif">Wait in queue</text>
            </g>

            <!-- Connector: Wait in queue -> In queue > 90 min? -->
            <line x1="210" y1="358" x2="210" y2="388" stroke="#9e988f" stroke-width="1.6" marker-end="url(#arrow)" />

            <!-- Node 4: In queue > 90 min? (Decision 2) -->
            <g class="node-card">
              <rect x="95" y="390" width="230" height="58" rx="8" fill="#fdf3e7" stroke="#e8d0b2" stroke-width="1.5" />
              <text x="210" y="414" text-anchor="middle" font-size="13" font-weight="700" fill="#6f4218" font-family="system-ui, -apple-system, sans-serif">In queue &gt; 90 min?</text>
              <text x="210" y="434" text-anchor="middle" font-size="11" font-weight="500" fill="#925f34" font-family="system-ui, -apple-system, sans-serif">Checks wait time</text>
            </g>

            <!-- Loopback: No (from In queue > 90 min back to Wait in queue) -->
            <path d="M 325 419 L 360 419 L 360 334 L 327 334" fill="none" stroke="#9e988f" stroke-width="1.6" marker-end="url(#arrow)" />
            <text x="372" y="375" font-size="12" font-weight="600" fill="#6b7280" font-family="system-ui, -apple-system, sans-serif">No</text>

            <!-- Branch: Yes (from In queue > 90 min to Auto-assign) -->
            <line x1="210" y1="448" x2="210" y2="478" stroke="#9e988f" stroke-width="1.6" marker-end="url(#arrow)" />
            <text x="222" y="466" font-size="12" font-weight="600" fill="#6b7280" font-family="system-ui, -apple-system, sans-serif">Yes</text>

            <!-- Node 5: Auto-assign To available technician -->
            <g class="node-card">
              <rect x="95" y="480" width="230" height="58" rx="8" fill="#f2f0ea" stroke="#d5d0c5" stroke-width="1.5" />
              <text x="210" y="504" text-anchor="middle" font-size="13" font-weight="700" fill="#292524" font-family="system-ui, -apple-system, sans-serif">Auto-assign</text>
              <text x="210" y="524" text-anchor="middle" font-size="11" font-weight="500" fill="#6b7280" font-family="system-ui, -apple-system, sans-serif">To available technician</text>
            </g>

            <!-- Node 6: Is manager available? (Decision 3) -->
            <g class="node-card">
              <rect x="495" y="310" width="230" height="58" rx="8" fill="#fdf3e7" stroke="#e8d0b2" stroke-width="1.5" />
              <text x="610" y="334" text-anchor="middle" font-size="13" font-weight="700" fill="#6f4218" font-family="system-ui, -apple-system, sans-serif">Is manager available?</text>
              <text x="610" y="354" text-anchor="middle" font-size="11" font-weight="500" fill="#925f34" font-family="system-ui, -apple-system, sans-serif">Checks manager status</text>
            </g>

            <!-- Branch: Yes (from Is manager available? to Manager Reviews ticket) -->
            <path d="M 540 368 L 540 388 L 485 388 L 485 410" fill="none" stroke="#9e988f" stroke-width="1.6" marker-end="url(#arrow)" />
            <text x="522" y="382" font-size="12" font-weight="600" fill="#6b7280" font-family="system-ui, -apple-system, sans-serif">Yes</text>

            <!-- Branch: No (from Is manager available? to Admin Reviews ticket) -->
            <path d="M 680 368 L 680 388 L 725 388 L 725 410" fill="none" stroke="#9e988f" stroke-width="1.6" marker-end="url(#arrow)" />
            <text x="695" y="382" font-size="12" font-weight="600" fill="#6b7280" font-family="system-ui, -apple-system, sans-serif">No</text>

            <!-- Node 7: Manager Reviews ticket -->
            <g class="node-card">
              <rect x="415" y="412" width="140" height="56" rx="8" fill="#e0f5ed" stroke="#a3e3cd" stroke-width="1.5" />
              <text x="485" y="435" text-anchor="middle" font-size="13" font-weight="700" fill="#065f46" font-family="system-ui, -apple-system, sans-serif">Manager</text>
              <text x="485" y="454" text-anchor="middle" font-size="11" font-weight="500" fill="#047857" font-family="system-ui, -apple-system, sans-serif">Reviews ticket</text>
            </g>

            <!-- Node 8: Admin Reviews ticket -->
            <g class="node-card">
              <rect x="655" y="412" width="140" height="56" rx="8" fill="#e0f5ed" stroke="#a3e3cd" stroke-width="1.5" />
              <text x="725" y="435" text-anchor="middle" font-size="13" font-weight="700" fill="#065f46" font-family="system-ui, -apple-system, sans-serif">Admin</text>
              <text x="725" y="454" text-anchor="middle" font-size="11" font-weight="500" fill="#047857" font-family="system-ui, -apple-system, sans-serif">Reviews ticket</text>
            </g>

            <!-- Convergence: Manager & Admin -> Approve ticket? -->
            <path d="M 485 468 L 485 490 L 595 490 L 595 508" fill="none" stroke="#9e988f" stroke-width="1.6" marker-end="url(#arrow)" />
            <path d="M 725 468 L 725 490 L 595 490" fill="none" stroke="#9e988f" stroke-width="1.6" />

            <!-- Node 9: Approve ticket? (Decision 4) -->
            <g class="node-card">
              <rect x="480" y="510" width="230" height="58" rx="8" fill="#fdf3e7" stroke="#e8d0b2" stroke-width="1.5" />
              <text x="595" y="534" text-anchor="middle" font-size="13" font-weight="700" fill="#6f4218" font-family="system-ui, -apple-system, sans-serif">Approve ticket?</text>
              <text x="595" y="554" text-anchor="middle" font-size="11" font-weight="500" fill="#925f34" font-family="system-ui, -apple-system, sans-serif">Reviewer decision</text>
            </g>

            <!-- Branch: Yes (from Approve ticket? down-left to Assign technician junction) -->
            <path d="M 530 568 L 530 595 L 380 595 L 380 668" fill="none" stroke="#9e988f" stroke-width="1.6" marker-end="url(#arrow)" />
            <text x="510" y="586" font-size="12" font-weight="600" fill="#6b7280" font-family="system-ui, -apple-system, sans-serif">Yes</text>

            <!-- Connector from Auto-assign into Assign technician junction -->
            <path d="M 210 538 L 210 655 L 380 655" fill="none" stroke="#9e988f" stroke-width="1.6" />

            <!-- Branch: No (from Approve ticket? to Set status Rejected) -->
            <path d="M 660 568 L 660 595 L 700 595 L 700 618" fill="none" stroke="#9e988f" stroke-width="1.6" marker-end="url(#arrow)" />
            <text x="675" y="586" font-size="12" font-weight="600" fill="#6b7280" font-family="system-ui, -apple-system, sans-serif">No</text>

            <!-- Node 10: Set status Rejected -->
            <g class="node-card">
              <rect x="600" y="620" width="200" height="56" rx="8" fill="#fce9e6" stroke="#f7c6bd" stroke-width="1.5" />
              <text x="700" y="643" text-anchor="middle" font-size="13" font-weight="700" fill="#991b1b" font-family="system-ui, -apple-system, sans-serif">Set status</text>
              <text x="700" y="662" text-anchor="middle" font-size="11" font-weight="600" fill="#b91c1c" font-family="system-ui, -apple-system, sans-serif">Rejected</text>
            </g>

            <!-- Connector: Set status Rejected -> Close ticket -->
            <line x1="700" y1="676" x2="700" y2="703" stroke="#9e988f" stroke-width="1.6" marker-end="url(#arrow)" />

            <!-- Node 11: Close ticket Notify employee -->
            <g class="node-card">
              <rect x="600" y="705" width="200" height="56" rx="8" fill="#f2f0ea" stroke="#d5d0c5" stroke-width="1.5" />
              <text x="700" y="728" text-anchor="middle" font-size="13" font-weight="700" fill="#292524" font-family="system-ui, -apple-system, sans-serif">Close ticket</text>
              <text x="700" y="747" text-anchor="middle" font-size="11" font-weight="500" fill="#6b7280" font-family="system-ui, -apple-system, sans-serif">Notify employee</text>
            </g>

            <!-- Rejection path to End -->
            <path d="M 700 761 L 700 1045 L 380 1045" fill="none" stroke="#9e988f" stroke-width="1.6" />

            <!-- Node 12: Assign technician -->
            <g class="node-card">
              <rect x="270" y="670" width="220" height="46" rx="8" fill="#e0f5ed" stroke="#a3e3cd" stroke-width="1.5" />
              <text x="380" y="698" text-anchor="middle" font-size="13.5" font-weight="700" fill="#065f46" font-family="system-ui, -apple-system, sans-serif">Assign technician</text>
            </g>

            <!-- Connector: Assign technician -> Set status In progress -->
            <line x1="380" y1="716" x2="380" y2="743" stroke="#9e988f" stroke-width="1.6" marker-end="url(#arrow)" />

            <!-- Node 13: Set status In progress, priority -->
            <g class="node-card">
              <rect x="270" y="745" width="220" height="56" rx="8" fill="#e0f5ed" stroke="#a3e3cd" stroke-width="1.5" />
              <text x="380" y="768" text-anchor="middle" font-size="13" font-weight="700" fill="#065f46" font-family="system-ui, -apple-system, sans-serif">Set status</text>
              <text x="380" y="787" text-anchor="middle" font-size="11" font-weight="600" fill="#047857" font-family="system-ui, -apple-system, sans-serif">In progress, priority</text>
            </g>

            <!-- Side branch: Notify employee -->
            <path d="M 270 773 L 160 773 L 160 818" fill="none" stroke="#9e988f" stroke-width="1.6" marker-end="url(#arrow)" />
            <g class="node-card">
              <rect x="80" y="820" width="160" height="44" rx="8" fill="#f2f0ea" stroke="#d5d0c5" stroke-width="1.5" />
              <text x="160" y="847" text-anchor="middle" font-size="12" font-weight="600" fill="#292524" font-family="system-ui, -apple-system, sans-serif">Notify employee</text>
            </g>

            <!-- Connector: Set status In progress -> Solve the problem -->
            <line x1="380" y1="801" x2="380" y2="833" stroke="#9e988f" stroke-width="1.6" marker-end="url(#arrow)" />

            <!-- Node 15: Solve the problem -->
            <g class="node-card">
              <rect x="270" y="835" width="220" height="46" rx="8" fill="#e0f5ed" stroke="#a3e3cd" stroke-width="1.5" />
              <text x="380" y="863" text-anchor="middle" font-size="13.5" font-weight="700" fill="#065f46" font-family="system-ui, -apple-system, sans-serif">Solve the problem</text>
            </g>

            <!-- Connector: Solve problem -> Set status: resolved -->
            <line x1="380" y1="881" x2="380" y2="908" stroke="#9e988f" stroke-width="1.6" marker-end="url(#arrow)" />

            <!-- Node 16: Set status: resolved -->
            <g class="node-card">
              <rect x="270" y="910" width="220" height="46" rx="8" fill="#e0f5ed" stroke="#a3e3cd" stroke-width="1.5" />
              <text x="380" y="938" text-anchor="middle" font-size="13.5" font-weight="700" fill="#065f46" font-family="system-ui, -apple-system, sans-serif">Set status: resolved</text>
            </g>

            <!-- Connector: Resolved -> Notify employee -->
            <line x1="380" y1="956" x2="380" y2="978" stroke="#9e988f" stroke-width="1.6" marker-end="url(#arrow)" />

            <!-- Node 17: Notify employee (before End) -->
            <g class="node-card">
              <rect x="270" y="980" width="220" height="44" rx="8" fill="#f2f0ea" stroke="#d5d0c5" stroke-width="1.5" />
              <text x="380" y="1007" text-anchor="middle" font-size="12.5" font-weight="600" fill="#292524" font-family="system-ui, -apple-system, sans-serif">Notify employee</text>
            </g>

            <!-- Connector: Notify employee -> End -->
            <line x1="380" y1="1024" x2="380" y2="1058" stroke="#9e988f" stroke-width="1.6" marker-end="url(#arrow)" />

            <!-- Node 18: End (Bottom Pill) -->
            <g class="node-card">
              <rect x="315" y="1060" width="130" height="40" rx="20" fill="#f2f0ea" stroke="#d5d0c5" stroke-width="1.5" />
              <text x="380" y="1085" text-anchor="middle" font-size="13" font-weight="600" fill="#292524" font-family="system-ui, -apple-system, sans-serif">End</text>
            </g>
          </svg>