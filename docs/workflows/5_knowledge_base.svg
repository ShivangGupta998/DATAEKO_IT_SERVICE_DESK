<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 840 1060" class="w-full h-auto drop-shadow-xs" xmlns="http://www.w3.org/2000/svg"><rect width="840" height="1060" fill="#ffffff"/>
            <text x="420" y="42" text-anchor="middle" font-size="20" font-weight="900" fill="#1c1917" letter-spacing="0.5" font-family="system-ui, -apple-system, sans-serif">IT SERVICE DESK (WORKFLOWS)</text>
            <line x1="260" y1="52" x2="580" y2="52" stroke="#1c1917" stroke-width="2.5" />
            <text x="50" y="95" font-size="16" font-weight="800" fill="#1c1917" font-family="system-ui, -apple-system, sans-serif">5) KNOWLEDGE BASE &amp; INCIDENT DEFLECTION</text>

            <line x1="420" y1="165" x2="420" y2="198" stroke="#9e988f" stroke-width="1.6" marker-end="url(#arrow)" />

            <!-- Start Pill -->
            <g class="node-card">
              <rect x="270" y="125" width="300" height="42" rx="21" fill="#f2f0ea" stroke="#d5d0c5" stroke-width="1.5" />
              <text x="420" y="151" text-anchor="middle" font-size="13.5" font-weight="600" fill="#292524" font-family="system-ui, -apple-system, sans-serif">Employee encounters IT issue</text>
            </g>

            <!-- Search KB -->
            <g class="node-card">
              <rect x="250" y="200" width="340" height="58" rx="8" fill="#f2f0ea" stroke="#d5d0c5" stroke-width="1.5" />
              <text x="420" y="224" text-anchor="middle" font-size="13" font-weight="700" fill="#292524" font-family="system-ui, -apple-system, sans-serif">Search Knowledge Base portal</text>
              <text x="420" y="244" text-anchor="middle" font-size="11" font-weight="500" fill="#6b7280" font-family="system-ui, -apple-system, sans-serif">Keyword search &amp; smart AI recommendations</text>
            </g>

            <line x1="420" y1="258" x2="420" y2="288" stroke="#9e988f" stroke-width="1.6" marker-end="url(#arrow)" />

            <!-- Decision: Relevant article found? -->
            <g class="node-card">
              <rect x="250" y="290" width="340" height="58" rx="8" fill="#fdf3e7" stroke="#e8d0b2" stroke-width="1.5" />
              <text x="420" y="314" text-anchor="middle" font-size="13" font-weight="700" fill="#6f4218" font-family="system-ui, -apple-system, sans-serif">Relevant article found?</text>
              <text x="420" y="334" text-anchor="middle" font-size="11" font-weight="500" fill="#925f34" font-family="system-ui, -apple-system, sans-serif">Evaluates matching self-service guides</text>
            </g>

            <!-- Branch: Yes -> Follow Solution -->
            <path d="M 330 348 L 330 372 L 210 372 L 210 398" fill="none" stroke="#9e988f" stroke-width="1.6" marker-end="url(#arrow)" />
            <text x="312" y="364" font-size="12" font-weight="600" fill="#6b7280" font-family="system-ui, -apple-system, sans-serif">Yes</text>

            <!-- Branch: No -> Submit Ticket -->
            <path d="M 510 348 L 510 372 L 610 372 L 610 398" fill="none" stroke="#9e988f" stroke-width="1.6" marker-end="url(#arrow)" />
            <text x="525" y="364" font-size="12" font-weight="600" fill="#6b7280" font-family="system-ui, -apple-system, sans-serif">No</text>

            <!-- Node: Follow Self-service solution -->
            <g class="node-card">
              <rect x="95" y="400" width="230" height="56" rx="8" fill="#e0f5ed" stroke="#a3e3cd" stroke-width="1.5" />
              <text x="210" y="423" text-anchor="middle" font-size="13" font-weight="700" fill="#065f46" font-family="system-ui, -apple-system, sans-serif">Follow self-service guide</text>
              <text x="210" y="442" text-anchor="middle" font-size="11" font-weight="500" fill="#047857" font-family="system-ui, -apple-system, sans-serif">Step-by-step resolution</text>
            </g>

            <line x1="210" y1="456" x2="210" y2="488" stroke="#9e988f" stroke-width="1.6" marker-end="url(#arrow)" />

            <!-- Decision: Issue resolved? -->
            <g class="node-card">
              <rect x="95" y="490" width="230" height="58" rx="8" fill="#fdf3e7" stroke="#e8d0b2" stroke-width="1.5" />
              <text x="210" y="514" text-anchor="middle" font-size="13" font-weight="700" fill="#6f4218" font-family="system-ui, -apple-system, sans-serif">Issue resolved?</text>
              <text x="210" y="534" text-anchor="middle" font-size="11" font-weight="500" fill="#925f34" font-family="system-ui, -apple-system, sans-serif">Employee confirmation</text>
            </g>

            <!-- Branch: Yes -> Deflected -->
            <line x1="210" y1="548" x2="210" y2="578" stroke="#9e988f" stroke-width="1.6" marker-end="url(#arrow)" />
            <text x="222" y="566" font-size="12" font-weight="600" fill="#6b7280" font-family="system-ui, -apple-system, sans-serif">Yes</text>

            <g class="node-card">
              <rect x="95" y="580" width="230" height="56" rx="8" fill="#e0f5ed" stroke="#a3e3cd" stroke-width="1.5" />
              <text x="210" y="603" text-anchor="middle" font-size="13" font-weight="700" fill="#065f46" font-family="system-ui, -apple-system, sans-serif">Incident Deflected! 🎉</text>
              <text x="210" y="622" text-anchor="middle" font-size="11" font-weight="600" fill="#047857" font-family="system-ui, -apple-system, sans-serif">Record helpful article feedback</text>
            </g>
            <path d="M 210 636 L 210 990 L 380 990" fill="none" stroke="#9e988f" stroke-width="1.6" />

            <!-- Branch: No -> Escalate into Ticket creation -->
            <path d="M 325 519 L 450 519 L 450 428 L 495 428" fill="none" stroke="#9e988f" stroke-width="1.6" marker-end="url(#arrow)" />
            <text x="350" y="512" font-size="12" font-weight="600" fill="#6b7280" font-family="system-ui, -apple-system, sans-serif">No</text>

            <!-- Submit Ticket Box -->
            <g class="node-card">
              <rect x="495" y="400" width="230" height="56" rx="8" fill="#f2f0ea" stroke="#d5d0c5" stroke-width="1.5" />
              <text x="610" y="423" text-anchor="middle" font-size="13" font-weight="700" fill="#292524" font-family="system-ui, -apple-system, sans-serif">Submit IT ticket</text>
              <text x="610" y="442" text-anchor="middle" font-size="11" font-weight="500" fill="#6b7280" font-family="system-ui, -apple-system, sans-serif">Routes to Ticket Management flow</text>
            </g>

            <line x1="610" y1="456" x2="610" y2="488" stroke="#9e988f" stroke-width="1.6" marker-end="url(#arrow)" />

            <!-- Technician solves & creates KB Candidate -->
            <g class="node-card">
              <rect x="495" y="490" width="230" height="58" rx="8" fill="#e0f5ed" stroke="#a3e3cd" stroke-width="1.5" />
              <text x="610" y="514" text-anchor="middle" font-size="13" font-weight="700" fill="#065f46" font-family="system-ui, -apple-system, sans-serif">Technician resolves ticket</text>
              <text x="610" y="534" text-anchor="middle" font-size="11" font-weight="500" fill="#047857" font-family="system-ui, -apple-system, sans-serif">Documents new reusable solution</text>
            </g>

            <line x1="610" y1="548" x2="610" y2="578" stroke="#9e988f" stroke-width="1.6" marker-end="url(#arrow)" />

            <!-- Decision: Recurring issue? -->
            <g class="node-card">
              <rect x="495" y="580" width="230" height="58" rx="8" fill="#fdf3e7" stroke="#e8d0b2" stroke-width="1.5" />
              <text x="610" y="604" text-anchor="middle" font-size="13" font-weight="700" fill="#6f4218" font-family="system-ui, -apple-system, sans-serif">Recurring issue for KB?</text>
              <text x="610" y="624" text-anchor="middle" font-size="11" font-weight="500" fill="#925f34" font-family="system-ui, -apple-system, sans-serif">Knowledge candidate check</text>
            </g>

            <!-- Branch: Yes -> Draft Article -->
            <line x1="610" y1="638" x2="610" y2="668" stroke="#9e988f" stroke-width="1.6" marker-end="url(#arrow)" />
            <text x="620" y="655" font-size="12" font-weight="600" fill="#6b7280" font-family="system-ui, -apple-system, sans-serif">Yes</text>

            <g class="node-card">
              <rect x="495" y="670" width="230" height="56" rx="8" fill="#e0f5ed" stroke="#a3e3cd" stroke-width="1.5" />
              <text x="610" y="693" text-anchor="middle" font-size="13" font-weight="700" fill="#065f46" font-family="system-ui, -apple-system, sans-serif">Draft KB article</text>
              <text x="610" y="712" text-anchor="middle" font-size="11" font-weight="500" fill="#047857" font-family="system-ui, -apple-system, sans-serif">Symptoms, screenshots &amp; steps</text>
            </g>

            <line x1="610" y1="726" x2="610" y2="758" stroke="#9e988f" stroke-width="1.6" marker-end="url(#arrow)" />

            <!-- Decision: Admin review -->
            <g class="node-card">
              <rect x="495" y="760" width="230" height="58" rx="8" fill="#fdf3e7" stroke="#e8d0b2" stroke-width="1.5" />
              <text x="610" y="784" text-anchor="middle" font-size="13" font-weight="700" fill="#6f4218" font-family="system-ui, -apple-system, sans-serif">Admin review &amp; verify?</text>
              <text x="610" y="804" text-anchor="middle" font-size="11" font-weight="500" fill="#925f34" font-family="system-ui, -apple-system, sans-serif">Technical accuracy &amp; formatting</text>
            </g>

            <!-- Branch: Yes -> Publish -->
            <line x1="610" y1="818" x2="610" y2="850" stroke="#9e988f" stroke-width="1.6" marker-end="url(#arrow)" />
            <text x="620" y="836" font-size="12" font-weight="600" fill="#6b7280" font-family="system-ui, -apple-system, sans-serif">Yes</text>

            <g class="node-card">
              <rect x="495" y="852" width="230" height="56" rx="8" fill="#e0f5ed" stroke="#a3e3cd" stroke-width="1.5" />
              <text x="610" y="875" text-anchor="middle" font-size="13" font-weight="700" fill="#065f46" font-family="system-ui, -apple-system, sans-serif">Publish to Knowledge Base</text>
              <text x="610" y="894" text-anchor="middle" font-size="11" font-weight="600" fill="#047857" font-family="system-ui, -apple-system, sans-serif">Status: Published &amp; Live</text>
            </g>

            <path d="M 610 908 L 610 990 L 460 990" fill="none" stroke="#9e988f" stroke-width="1.6" marker-end="url(#arrow)" />

            <!-- End Pill -->
            <g class="node-card">
              <rect x="355" y="970" width="130" height="40" rx="20" fill="#f2f0ea" stroke="#d5d0c5" stroke-width="1.5" />
              <text x="420" y="995" text-anchor="middle" font-size="13" font-weight="600" fill="#292524" font-family="system-ui, -apple-system, sans-serif">End</text>
            </g>
          </svg>